services:
  # 1. Database Service
  db:
    image: postgres:15-alpine
    container_name: template_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Exposed to host so you can use DBeaver/TablePlus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Elasticsearch Service (SIEM Log Storage)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: template_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 3. Python Backend Service
  backend:
    build: ./backend
    container_name: template_backend
    volumes:
      - ./backend:/app # Hot reload: changes in host reflect in container
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      frontend:
        condition: service_started
    env_file:
      - .env
    environment:
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - GCP_CLIENT_ID=${GCP_CLIENT_ID}
      - GCP_CLIENT_SECRET=${GCP_CLIENT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - ALERT_EMAIL_RECIPIENTS=${ALERT_EMAIL_RECIPIENTS}
    expose:
      - "8000" # Reserved for FastAPI

  # 4. Frontend Service
  frontend:
    build: ./frontend
    container_name: template_frontend
    volumes:
      - ./frontend:/app # Hot reload
      - frontend_node_modules:/app/node_modules # Prevent host node_modules from overwriting container's
      - frontend_next:/app/.next # Prevent .next build cache from conflicting
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx drizzle-kit push --force && npm run dev"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    expose:
      - "3000" # Reserved for Next.js

  # 5. Nginx Proxy Service
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - NGINX_FORWARDED_PROTO=${NGINX_FORWARDED_PROTO:-http}
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}

volumes:
  postgres_data:
  es_data:
  frontend_node_modules:
  frontend_next:
